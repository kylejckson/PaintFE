name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release
        # .cargo/config.toml applies -C target-feature=+crt-static on Windows,
        # statically linking vcruntime into the EXE — no external C++ dependency
        # (satisfies Microsoft Store policy 10.2.4.1).
        env:
          PAINTFE_PACK_SIGNING_KEY: ${{ secrets.OPTIONAL_PACK_SIGNING_KEY }}
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: |
          dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode
          dotnet publish paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -r win-x64 --self-contained true --no-restore -m:1 -o target/release/paintdotnet-host
          (Get-FileHash target/release/paintdotnet-host/PaintFE.PaintDotNetHost.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline target/release/paintdotnet-host/PaintFE.PaintDotNetHost.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-windows
          retention-days: 1
          path: |
            target/release/PaintFE.exe
            target/release/paintdotnet-host

      - name: Upload optional feature packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: optional-packs-build-windows
          retention-days: 1
          path: target/optional-packs/*/release/*.pfepack
          if-no-files-found: error


  # ── Linux build ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libssl-dev \
            cmake \
            libclang-dev \
            pkg-config \
            nasm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release
        env:
          PAINTFE_PACK_SIGNING_KEY: ${{ secrets.OPTIONAL_PACK_SIGNING_KEY }}
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: bash paintdotnet-host/publish.sh linux-x64 target/release/paintdotnet-host

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-linux
          retention-days: 1
          path: |
            target/release/PaintFE
            target/release/paintdotnet-host

      - name: Upload optional feature packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: optional-packs-build-linux
          retention-days: 1
          path: target/optional-packs/*/release/*.pfepack
          if-no-files-found: error


  # ── Native Linux packages ──────────────────────────────────────────────────
  build-linux-packages:
    name: Package (DEB / RPM)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm file
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-linux
          path: native-input
      - name: Package the existing Linux build
        run: bash packaging/linux/build-packages.sh native-input native-packages
      - name: Check DEB installation and CLI startup
        run: |
          sudo apt-get install -y ./native-packages/PaintFE-linux-x64.deb
          ldd /usr/lib/paintfe/PaintFE > package-libraries.txt
          ldd /usr/lib/paintfe/paintdotnet-host/PaintFE.PaintDotNetHost >> package-libraries.txt
          if grep 'not found' package-libraries.txt; then exit 1; fi
          PaintFE -i package-check --help > /dev/null
          sudo apt-get remove -y paintfe
      - name: Sign RPM package
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          source packaging/linux/signing-key.sh
          sign_rpm native-packages/PaintFE-linux-x64.rpm
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-linux-packages
          retention-days: 1
          path: native-packages/*
          if-no-files-found: error

  # ── AppImage build ─────────────────────────────────────────────────────────
  build-appimage:
    name: Build (AppImage)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libfuse2 \
            cmake \
            libclang-dev \
            pkg-config \
            nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: appimage-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: appimage-cargo-

      - name: Reuse signed-pack-compatible core build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-linux
          path: target/release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: bash paintdotnet-host/publish.sh linux-x64

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-appimage
          retention-days: 1
          path: PaintFE-x86_64.AppImage

  # ── macOS build (Apple Silicon — aarch64) ────────────────────────────────────
  build-macos-arm:
    name: Build (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm-cargo-

      - name: Build release
        env:
          PAINTFE_PACK_SIGNING_KEY: ${{ secrets.OPTIONAL_PACK_SIGNING_KEY }}
        run: |
          python -m pip install cryptography==46.0.7
          brew install nasm
          python tools/build_optional_packs.py --release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: bash paintdotnet-host/publish.sh osx-arm64

      - name: Create app bundle and DMG
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          source packaging/macos/signing-env.sh
          bash packaging/macos/package.sh target/release/PaintFE target/pdn-host/osx-arm64 arm64 "${GITHUB_REF_NAME#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-macos-arm64
          retention-days: 1
          path: PaintFE-macOS-arm64.dmg

      - name: Upload optional feature packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: optional-packs-build-macos-arm
          retention-days: 1
          path: target/optional-packs/*/release/*.pfepack
          if-no-files-found: error


  # ── macOS build (Intel — x86_64) ──────────────────────────────────────────
  build-macos-x86:
    name: Build (macOS Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-x86-cargo-

      - name: Build release (cross-compile for Intel)
        env:
          PAINTFE_PACK_SIGNING_KEY: ${{ secrets.OPTIONAL_PACK_SIGNING_KEY }}
        run: |
          python -m pip install cryptography==46.0.7
          brew install nasm
          python tools/build_optional_packs.py --release --target x86_64-apple-darwin

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: bash paintdotnet-host/publish.sh osx-x64

      - name: Create app bundle and DMG
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          source packaging/macos/signing-env.sh
          bash packaging/macos/package.sh target/x86_64-apple-darwin/release/PaintFE target/pdn-host/osx-x64 x86_64 "${GITHUB_REF_NAME#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-macos-x86_64
          retention-days: 1
          path: PaintFE-macOS-x86_64.dmg

  # ── MSIX build (Microsoft Store submission package) ────────────────────────
      - name: Upload optional feature packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: optional-packs-build-macos-x86
          retention-days: 1
          path: target/optional-packs/*/release/*.pfepack
          if-no-files-found: error


  # Download the artifact from Actions and submit it to Partner Center manually.
  build-msix:
    name: Build (MSIX / MS Store)
    needs: build-windows
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msix-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msix-cargo-

      - name: Reuse signed-pack-compatible core build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-windows
          path: target/release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Publish Paint.NET plugin host
        run: |
          dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode
          dotnet publish paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -r win-x64 --self-contained true --no-restore -m:1 -o target/release/paintdotnet-host
          (Get-FileHash target/release/paintdotnet-host/PaintFE.PaintDotNetHost.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline target/release/paintdotnet-host/PaintFE.PaintDotNetHost.exe.sha256

      - name: Generate Store icon assets
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          & packaging\msix\gen-assets.ps1

      - name: Stage PackageLayout
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path packaging\msix\PackageLayout | Out-Null
          Copy-Item target\release\PaintFE.exe packaging\msix\PackageLayout\
          Copy-Item -Recurse -Force target\release\paintdotnet-host packaging\msix\PackageLayout\paintdotnet-host
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = "$tag.0"
          # Read raw bytes, strip UTF-8 BOM (EF BB BF) if present, decode, patch, re-encode, write
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\packaging\msix\AppxManifest.xml")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $bytes = $bytes[3..($bytes.Length - 1)]
          }
          $src = [System.Text.Encoding]::UTF8.GetString($bytes)
          $src = $src -creplace '(?<=\s)Version="[\d.]+"', "Version=`"$ver`""
          $outBytes = [System.Text.Encoding]::UTF8.GetBytes($src)
          [System.IO.File]::WriteAllBytes("$PWD\packaging\msix\PackageLayout\AppxManifest.xml", $outBytes)
          Copy-Item -Recurse -Force packaging\msix\assets packaging\msix\PackageLayout\assets

      - name: Locate makeappx.exe
        id: find_makeappx
        run: |
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $exe = Get-ChildItem "$pf86\Windows Kits\10\bin" `
            -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "makeappx.exe not found"; exit 1 }
          echo "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Pack MSIX
        run: |
          & "${{ steps.find_makeappx.outputs.path }}" `
            pack /d packaging\msix\PackageLayout /p PaintFE.msix /nv

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PaintFE-msix-store-submission
          retention-days: 14
          path: PaintFE.msix
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-linux-packages, build-appimage, build-macos-arm, build-macos-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pack verification tools
        run: python -m pip install cryptography==46.0.7

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            awk -v version="${RELEASE_TAG#v}" '
              /^## \[/ {
                if (found) exit
                if (index($0, "## [" version "]") == 1) found = 1
                next
              }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          test -s release-notes.md

      - name: Download Windows binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-windows
          path: dist/windows

      - name: Download Linux binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-linux
          path: dist/linux

      - name: Download native Linux packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-linux-packages
          path: dist/packages

      - name: Download AppImage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-appimage
          path: dist/linux

      - name: Download macOS ARM binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-macos-arm64
          path: dist/macos

      - name: Download macOS Intel binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: PaintFE-macos-x86_64
          path: dist/macos

      - name: Download optional feature packs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: optional-packs-*
          merge-multiple: true
          path: dist/packs-input

      - name: Verify and stage all optional feature packs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/stage_release_packs.py --tag "$RELEASE_TAG" --source dist/packs-input --destination dist/packs --core dist/windows/PaintFE.exe

      - name: Make binaries executable
        run: |
          chmod +x dist/linux/PaintFE
          chmod +x dist/linux/PaintFE-x86_64.AppImage
          chmod +x dist/linux/paintdotnet-host/PaintFE.PaintDotNetHost

      - name: Package portable builds with Paint.NET host
        run: |
          cd dist
          mkdir -p PaintFE-windows-x64 PaintFE-linux-x64
          cp windows/PaintFE.exe PaintFE-windows-x64/
          cp -R windows/paintdotnet-host PaintFE-windows-x64/paintdotnet-host
          cp linux/PaintFE PaintFE-linux-x64/
          cp -R linux/paintdotnet-host PaintFE-linux-x64/paintdotnet-host
          zip -r PaintFE-windows-x64.zip PaintFE-windows-x64
          tar -czf PaintFE-linux-x64.tar.gz PaintFE-linux-x64

      - name: Generate Homebrew cask
        run: |
          cd dist/macos
          bash ../../packaging/macos/generate-cask.sh "${GITHUB_REF_NAME#v}" > paintfe.rb

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum windows/PaintFE.exe \
            windows/paintdotnet-host/PaintFE.PaintDotNetHost.exe \
            windows/paintdotnet-host/PaintFE.PaintDotNetHost.exe.sha256 \
            linux/PaintFE linux/PaintFE-x86_64.AppImage \
            linux/paintdotnet-host/PaintFE.PaintDotNetHost \
            linux/paintdotnet-host/PaintFE.PaintDotNetHost.sha256 \
            PaintFE-windows-x64.zip PaintFE-linux-x64.tar.gz \
            packages/PaintFE-linux-x64.deb packages/PaintFE-linux-x64.rpm \
            macos/PaintFE-macOS-arm64.dmg macos/PaintFE-macOS-x86_64.dmg \
            | sed 's|windows/||; s|linux/||; s|macos/||; s|packages/||' \
            > checksums-SHA256.txt
          sha256sum packs/*.pfepack | sed 's|packs/||' >> checksums-SHA256.txt
          cat checksums-SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          name: PaintFE ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/windows/PaintFE.exe
            dist/linux/PaintFE
            dist/linux/PaintFE-x86_64.AppImage
            dist/PaintFE-windows-x64.zip
            dist/PaintFE-linux-x64.tar.gz
            dist/packages/PaintFE-linux-x64.deb
            dist/packages/PaintFE-linux-x64.rpm
            dist/macos/PaintFE-macOS-arm64.dmg
            dist/macos/PaintFE-macOS-x86_64.dmg
            dist/macos/paintfe.rb
            dist/checksums-SHA256.txt
            dist/packs/*.pfepack

      - name: Verify published optional feature downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/stage_release_packs.py --tag "$RELEASE_TAG" --destination dist/packs --verify-published
