name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-clippy-

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check shared UI control boundary
        run: python tools/check_ui_controls.py --self-test

      - name: Prepare signed optional packs for codec tests
        shell: pwsh
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --helper-only
          $metadata = Get-Content target/optional-packs/windows-x86_64/debug/build-env.json | ConvertFrom-Json
          $metadata.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
          "PAINTFE_TEST_JXL_PACK=$((Get-ChildItem target/optional-packs/windows-x86_64/debug/*jxl*.pfepack).FullName)" >> $env:GITHUB_ENV
          "PAINTFE_TEST_STORAGE_DIR=$PWD/target/codec-test-storage" >> $env:GITHUB_ENV

      - name: Test JPEG XL codecs
        run: cargo test -j1 --test jpeg_xl -- --test-threads=1

      - name: Test shared control interactions
        run: cargo test -j1 --lib ui::controls -- --test-threads=1

      - name: Test numeric editor interactions
        run: cargo test -j1 --lib ui::numeric -- --test-threads=1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore Paint.NET compatibility host
        run: dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode

      - name: Build Paint.NET compatibility host
        run: dotnet build paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release --no-restore -m:1

      - name: Test compatibility host and fixture plugin
        shell: pwsh
        run: |
          dotnet restore paintdotnet-host/tests/LegacyFixture/LegacyFixture.csproj --locked-mode
          dotnet build paintdotnet-host/tests/LegacyFixture/LegacyFixture.csproj -c Release --no-restore
          dotnet run --project paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -- --self-test paintdotnet-host/tests/LegacyFixture/bin/Release/net8.0/LegacyFixture.dll

      - name: Test PDN import fixture
        run: |
          dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode
          dotnet publish paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -r win-x64 --self-contained true --no-restore -m:1 -o target/pdn-host/win-x64
          (Get-FileHash target/pdn-host/win-x64/PaintFE.PaintDotNetHost.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline target/pdn-host/win-x64/PaintFE.PaintDotNetHost.exe.sha256
          cargo test pdn --lib

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  build-macos:
    name: Build check (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-macos-

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Prepare signed optional packs for codec tests
        shell: pwsh
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --helper-only
          $metadata = Get-Content target/optional-packs/windows-x86_64/debug/build-env.json | ConvertFrom-Json
          $metadata.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
          "PAINTFE_TEST_JXL_PACK=$((Get-ChildItem target/optional-packs/windows-x86_64/debug/*jxl*.pfepack).FullName)" >> $env:GITHUB_ENV
          "PAINTFE_TEST_STORAGE_DIR=$PWD/target/codec-test-storage" >> $env:GITHUB_ENV

      - name: Test JPEG XL codecs
        run: cargo test -j1 --test jpeg_xl -- --test-threads=1
