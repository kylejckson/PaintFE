name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-clippy-

      - name: Test release tooling
        run: |
          python -m pip install cryptography==46.0.7
          python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Run Clippy
        run: cargo clippy --all-targets -j1 -- -D warnings

      - name: Check shared UI control boundary
        run: python tools/check_ui_controls.py --self-test

      - name: Prepare signed optional packs for codec tests
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --helper-only --github-env

      - name: Test JPEG XL codecs
        run: cargo test -j1 --test jpeg_xl -- --test-threads=1

      - name: Test shared control interactions
        run: cargo test -j1 --lib ui::controls -- --test-threads=1

      - name: Test numeric editor interactions
        run: cargo test -j1 --lib ui::numeric -- --test-threads=1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore Paint.NET compatibility host
        run: dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode

      - name: Build Paint.NET compatibility host
        run: dotnet build paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release --no-restore -m:1

      - name: Test compatibility host and fixture plugin
        shell: pwsh
        run: |
          dotnet restore paintdotnet-host/tests/LegacyFixture/LegacyFixture.csproj --locked-mode
          dotnet build paintdotnet-host/tests/LegacyFixture/LegacyFixture.csproj -c Release --no-restore
          dotnet run --project paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -- --self-test paintdotnet-host/tests/LegacyFixture/bin/Release/net8.0/LegacyFixture.dll

      - name: Test PDN import fixture
        run: |
          dotnet restore paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj --locked-mode
          dotnet publish paintdotnet-host/src/PaintFE.PaintDotNetHost/PaintFE.PaintDotNetHost.csproj -c Release -r win-x64 --self-contained true --no-restore -m:1 -o target/pdn-host/win-x64
          (Get-FileHash target/pdn-host/win-x64/PaintFE.PaintDotNetHost.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline target/pdn-host/win-x64/PaintFE.PaintDotNetHost.exe.sha256
          cargo test pdn --lib

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  build-unix:
    name: Build check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libvulkan-dev libwayland-dev libegl1-mesa-dev libssl-dev libfontconfig1-dev cmake libclang-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-

      - name: Run Clippy
        run: cargo clippy --all-targets -j1 -- -D warnings

      - name: Prepare signed optional packs for codec tests
        run: |
          python -m pip install cryptography==46.0.7
          python tools/build_optional_packs.py --helper-only --github-env

      - name: Test JPEG XL codecs
        run: cargo test -j1 --test jpeg_xl -- --test-threads=1

      - name: Test optional pack and icon pack handling
        run: |
          cargo test -j1 --lib services::optional_packs -- --test-threads=1
          cargo test -j1 --lib config::icon_packs -- --test-threads=1

  package-signing:
    name: RPM signing regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg python3
      - name: Test encrypted-key RPM signing and verification
        run: bash packaging/linux/test-signing.sh
