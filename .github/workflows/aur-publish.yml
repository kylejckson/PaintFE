name: Publish to AUR

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
      AUR_USERNAME:
        required: true
      AUR_EMAIL:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version, for example 1.5.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  aur-publish:
    if: github.repository == 'kylejckson/PaintFE'
    name: Publish ${{ matrix.pkgname }} to AUR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pkgname: paintfe
            pkgbuild_path: target/aur/PKGBUILD
          - pkgname: paintfe-bin
            pkgbuild_path: target/aur/PKGBUILD-bin
    steps:
      - name: Checkout trusted packaging tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false

      - name: Verify published release and prepare recipes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_VERSION: ${{ inputs.version }}
          AUR_REPOSITORY: ${{ github.repository }}
          AUR_EVENT: ${{ github.event_name }}
          AUR_RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 tools/prepare_aur_release.py

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: ${{ matrix.pkgbuild_path }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to v${{ steps.version.outputs.version }}
          updpkgsums: true
          test: false
          allow_empty_commits: false
