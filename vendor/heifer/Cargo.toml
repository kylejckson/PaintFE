[package]
name = "heifer"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HarpeLm/Heifer"
description = "HEIF/HEIC decoder with PaintFE's local alpha fixes"

[features]
image = ["dep:image"]

[dependencies]
heifer-hevc-dec = "=0.2.0"
heifer-hevc-enc = "=0.2.0"
heifer-isobmff = "=0.2.0"
thiserror = "2"
image = { version = "0.25.8", optional = true, default-features = false }
