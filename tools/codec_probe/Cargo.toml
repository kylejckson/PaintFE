[package]
name = "paintfe-codec-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
avif-encode = ["dep:image", "image/avif"]
avif-fast = ["avif-encode", "image/nasm", "image/rayon"]
avif-decode = ["dep:image", "image/avif-native"]

[dependencies]
image = { version = "=0.25.9", default-features = false, optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
